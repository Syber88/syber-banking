spring.datasource.url=jdbc:postgresql://localhost:5433/banking
spring.datasource.username=postgres
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
server.port=8081
banking.verification.auto-approve=true

# OTP delivery. 'log' prints codes to the application log (dev only).
# Set to 'email' and configure spring.mail.* below to send for real.
banking.otp.channel=log
banking.otp.from=no-reply@syberbanking.local

#spring.mail.host=smtp.gmail.com
#spring.mail.port=587
#spring.mail.username=${MAIL_USERNAME}
#spring.mail.password=${MAIL_PASSWORD}
#spring.mail.properties.mail.smtp.auth=true
#spring.mail.properties.mail.smtp.starttls.enable=true

# --- Session and cookie hardening ---
# Idle timeout: the session dies 30 minutes after the last request.
server.servlet.session.timeout=30m

# HttpOnly keeps JavaScript away from the cookie (XSS defence).
server.servlet.session.cookie.http-only=true

# SameSite=Lax means the cookie is NOT sent on cross-site POSTs, which blocks
# the common CSRF shape before the token is even checked. 'Strict' would also
# drop it on ordinary inbound links.
server.servlet.session.cookie.same-site=lax

# Secure=false ONLY because local development is plain HTTP; a Secure cookie is
# never sent over http:// and every request would look logged out.
# MUST be true in production, where it stops the session travelling in clear.
server.servlet.session.cookie.secure=false
